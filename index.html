<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Mini Prof - Le Chatbot de l'École Mignonne!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive;
            background: linear-gradient(135deg, #ffe6f2 0%, #e6f7ff 50%, #f0e6ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3),
                        inset 0 0 60px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #fff;
        }

        /* Header */
        .header {
            background: linear-gradient(90deg, #ff6b9d 0%, #a29bfe 100%);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .stars {
            position: absolute;
            font-size: 20px;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: linear-gradient(180deg, #fff5f7 0%, #f0f4ff 100%);
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 12px 20px;
            border-radius: 25px;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .message.prof {
            background: linear-gradient(135deg, #ffe6f2 0%, #ffc8dd 100%);
            margin-right: auto;
            border-bottom-right-radius: 5px;
        }

        .message.student {
            background: linear-gradient(135deg, #e6f7ff 0%, #b3e0ff 100%);
            margin-left: auto;
            border-bottom-left-radius: 5px;
        }

        .message.prof::before {
            content: '🎓';
            position: absolute;
            right: -35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            animation: float 3s ease-in-out infinite;
        }

        .message.student::before {
            content: '👨‍🎓';
            position: absolute;
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-52%) rotate(5deg); }
        }

        /* Input Area */
        .input-container {
            padding: 20px;
            background: linear-gradient(90deg, #fff 0%, #f8f0fc 100%);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 3px solid #ff6b9d;
            border-radius: 25px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
            border-color: #a29bfe;
        }

        button.send-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c866ff 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
        }

        button.send-btn:active {
            transform: translateY(0);
        }

        /* Characters Display */
        .characters {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            display: flex;
            gap: 10px;
        }

        .character-avatar {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .character-avatar:hover {
            transform: scale(1.2) rotate(10deg);
        }

        /* Decoration */
        .decoration {
            position: absolute;
            font-size: 40px;
            opacity: 0.3;
        }

        .d1 { top: 50%; left: -20px; animation: float 4s ease-in-out infinite; }
        .d2 { bottom: 50%; right: -20px; animation: float 3s ease-in-out infinite reverse; }
        
        /* Typing indicator */
        .typing-indicator {
            display: none;
            padding: 12px 20px;
            background: linear-gradient(135deg, #fff5f7 0%, #f0f4ff 100%);
            border-radius: 25px;
            margin-bottom: 15px;
            max-width: 80%;
        }

        .typing-indicator.show {
            display: block;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #a29bfe;
            border-radius: 50%;
            animation: typing 1.4s infinite;
            margin: 0 2px;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐱 Mini Prof - L'École Mignonne! 📚✨</h1>
            <div class="stars">⭐ ✨ 💫</div>
        </div>

        <!-- Characters -->
        <div class="characters">
            <span class="character-avatar" title="Monsieur Chat">🐱</span>
            <span class="character-avatar" title="Mademoiselle Lapin">🐰</span>
            <span class="character-avatar" title="Géant Dino">🦕</span>
        </div>

        <!-- Decorations -->
        <div class="decoration d1">📖</div>
        <div class="decoration d2">✏️</div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer"></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Dis bonjour à Mini Prof! 🎓" autocomplete="off">
            <button class="send-btn" id="sendBtn">Envoyer ✈️</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        // Mini Prof's responses - super mignon!
        const responses = {
            greetings: [
                "Bonjour chérie! 🎓 Je suis Mini Prof, ton assistant scolaire préféré! Qu'est-ce qu'on fait aujourd'hui? 💕",
                "Salut ma p'tite élève ! 👋 Prête pour apprendre des choses super drôles? 🦄",
                "BONJOURUUU! ✨ Comment ça va toi? Tu as une question ou tu veux juste discuter? 😊"
            ],
            default: [
                "Wouh, c'est intéressant! Dis-m'en plus! 🤩",
                "Ohhh je vois! Continue comme ça! 💫",
                "C'est mignon! J'adore! ❤️",
                "Super question! Laisse-moi y réfléchir... 🤔✨",
                "C'est génial que tu me demandes ça! 🌟",
                "Mwah! Je t'aime bien! 🍓💕"
            ],
            school: [
                "Pour apprendre la division, on utilise des billes! On les partage en groupes égaux! 🎲 C'est comme si tu partageais tes bonbons avec tes amis! 🍭",
                "En sciences, on fait des expériences super sympas! Tu peux mélanger de l'eau et du lait pour voir ce qui se passe... mais attention, c'est un peu laqué ! 😂🧪",
                "En histoire, on apprend les dates importantes! Comme 14-18 pour la Grande Guerre! 📜 C'est l'histoire de tous les gens qui ont changé le monde!"
            ],
            thanks: [
                "De rien ma chérie! 😘 Toujours à ta disposition!",
                "Avec plaisir! 💕",
                "Pas de souci! J'aime bien t'aider! 🌸"
            ]
        };

        function getRandomResponse(type) {
            const list = responses[type] || responses.default;
            return list[Math.floor(Math.random() * list.length)];
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            
            // Insert before typing indicator
            chatContainer.insertBefore(messageDiv, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getResponse(input) {
            const lowerInput = input.toLowerCase().trim();
            
            if (lowerInput.match(/bonjour|salut|hello|hola|hi/i)) return getRandomResponse('greetings');
            if (lowerInput.includes('merci') || lowerInput.includes('thanks')) return getRandomResponse('thanks');
            if (lowerInput.includes('math') || lowerInput.includes('division') || 
                lowerInput.includes('addition') || lowerInput.includes('apprendre')) {
                return getRandomResponse('school');
            }
            return getRandomResponse('default');
        }

        function showTyping() {
            typingIndicator.classList.add('show');
            chatContainer.appendChild(typingIndicator);
        }

        function hideTyping() {
            typingIndicator.classList.remove('show');
        }

        function processMessage(input) {
            if (!input.trim()) return;

            addMessage(input, 'student');
            showTyping();

            // Simulate thinking time
            setTimeout(() => {
                hideTyping();
                const response = getResponse(input);
                addMessage(response, 'prof');
            }, 1500 + Math.random() * 1000);
        }

        function sendMessage() {
            const input = messageInput.value;
            if (!input.trim()) return;

            processMessage(input);
            messageInput.value = '';
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Add welcome message on load
        setTimeout(() => {
            const welcomeMsg = getRandomResponse('greetings');
            addMessage(welcomeMsg, 'prof');
        }, 500);
    </script>
</body>
</html>
